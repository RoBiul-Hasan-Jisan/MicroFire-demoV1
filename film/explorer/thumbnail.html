<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MicroFire Atlas thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=block" rel="stylesheet">
<style>
  /* YouTube thumbnail, 1280x720 (rendered at 2x). Flames are illustrations of the idea, not data. */
  * { margin: 0; box-sizing: border-box; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #050b18; font-family: "Fredoka", system-ui, sans-serif; }
  .plate { position: absolute; inset: 0; background: url("../../apps/web/public/art/worlds/lab.webp") 70% 40% / cover; filter: saturate(1.15) brightness(.78); }
  .shade { position: absolute; inset: 0; background:
      linear-gradient(90deg, #040a18f2 0%, #040a18d0 34%, #040a1830 62%, #040a1866 100%),
      linear-gradient(0deg, #040a18e6 0%, transparent 34%); }

  .title { position: absolute; left: 52px; top: 40px; line-height: .86; font-weight: 700; letter-spacing: -.02em; }
  .title .a { display: block; font-size: 220px; color: #ffcf6b; -webkit-text-stroke: 6px #2a1404; paint-order: stroke fill;
    text-shadow: 0 0 40px #ff9a2e88, 0 10px 0 #2a1404; }
  .title .b { display: block; margin-top: 10px; font-size: 116px; color: #fff; -webkit-text-stroke: 5px #061020; paint-order: stroke fill;
    text-shadow: 0 8px 0 #061020, 0 0 30px #3fa9ff66; }
  .title .q { color: #8eeaf5; }

  .chip { position: absolute; left: 58px; top: 448px; display: flex; gap: 10px; }
  .chip span { font-size: 24px; font-weight: 700; padding: 7px 16px; border-radius: 30px; color: #121417; background: #8eeaf5; box-shadow: 0 6px 20px #0008; }
  .chip span + span { background: #ffcc79; }

  /* the comparison: a tall Earth flame vs a round blue flame in orbit */
  .duo { position: absolute; left: 500px; bottom: 92px; width: 440px; height: 400px; }
  .earth { position: absolute; left: 0; bottom: 0; width: 120px; height: 330px; }
  .earth .flame { position: absolute; left: 22px; bottom: 120px; width: 76px; height: 200px; border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    background: radial-gradient(ellipse at 50% 85%, #fff8d0 0 12%, #ffd34a 26%, #ff8a1f 55%, #ff5a1a00 75%);
    filter: drop-shadow(0 0 24px #ff8a1f) drop-shadow(0 0 60px #ff6a0088); }
  .earth .candle { position: absolute; left: 40px; bottom: 0; width: 40px; height: 126px; border-radius: 6px; background: linear-gradient(90deg, #d9cdb4, #fff6e4 45%, #cdbf9f); }
  .earth .wick { position: absolute; left: 58px; bottom: 122px; width: 4px; height: 14px; background: #2b2118; }
  .space { position: absolute; right: 0; bottom: 50px; width: 280px; height: 280px; }
  .space .halo { position: absolute; inset: -60px; border-radius: 50%; background: radial-gradient(circle, #3b7bff66 0%, #2a4bff22 45%, transparent 70%); }
  .space .ball { position: absolute; inset: 20px; border-radius: 50%;
    background: radial-gradient(circle at 50% 48%, #ffffff 0 9%, #cfe6ff 18%, #6fa8ff 38%, #2f56ff 62%, #1b2fd000 76%);
    filter: drop-shadow(0 0 30px #4f86ff) drop-shadow(0 0 80px #2f56ffaa); }
  .lab { position: absolute; font-size: 26px; font-weight: 700; color: #fff; padding: 4px 14px; border-radius: 14px; background: #061020d9; border: 2px solid #ffffff55; }
  .lab.e { left: 16px; bottom: -36px; border-color: #ff9a2e; color: #ffd08a; }
  .lab.s { right: 86px; bottom: -36px; border-color: #6fa8ff; color: #bcd6ff; }
  .arrow { position: absolute; left: 122px; bottom: 150px; font-size: 64px; font-weight: 700; color: #fff; text-shadow: 0 0 20px #8eeaf5; }

  .tala { position: absolute; right: -96px; bottom: -14px; height: 610px; filter: drop-shadow(0 18px 30px #000c) drop-shadow(0 0 30px #ffb34733); }
  .pix { position: absolute; left: 690px; top: 120px; width: 150px; transform: rotate(14deg); filter: drop-shadow(0 12px 24px #000c); }

  .brand { position: absolute; left: 58px; bottom: 34px; font-size: 30px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; text-shadow: 0 3px 12px #000; }
  .brand i { width: 16px; height: 16px; border-radius: 50%; background: #ffcf6b; box-shadow: 0 0 14px 4px #ff9a2e; }
</style>
</head>
<body>
  <div class="plate"></div>
  <div class="shade"></div>

  <h1 class="title"><span class="a">FIRE</span><span class="b">IN SPACE<span class="q">?</span></span></h1>
  <div class="chip"><span>Real NASA data</span><span>Kids' adventure</span></div>

  <div class="duo" aria-hidden="true">
    <div class="earth"><div class="flame"></div><div class="wick"></div><div class="candle"></div><span class="lab e">Earth</span></div>
    <div class="arrow">→</div>
    <div class="space"><div class="halo"></div><div class="ball"></div><span class="lab s">Space</span></div>
  </div>

  <img class="pix" src="../../apps/web/public/art/pix.webp" alt="">
  <img class="tala" src="../../apps/web/public/art/tala.webp" alt="">
  <p class="brand"><i></i>MicroFire Atlas</p>
</body>
</html>
