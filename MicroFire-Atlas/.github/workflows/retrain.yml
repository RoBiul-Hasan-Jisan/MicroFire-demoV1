name: retrain-and-changelog
on:
  push:
    paths:
      - "data/curated/extra_runs.csv"
      - "data/curated/partial_gravity_validation.csv"
      - "data/curated/gravity_bridge_spec.json"
      - "data/curated/visibility_manifest.json"
  workflow_dispatch:
jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scikit-learn
      - run: python3 pipelines/retrain.py
      - run: python3 -m unittest discover tests
      - name: Commit refreshed model, plan and changelog
        run: |
          git config user.name "microfire-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/processed apps/web/data docs/MODEL_CHANGELOG.md
          git diff --cached --quiet || git commit -m "Retrain after new cited rows (auto)" && git push
