openapi: 3.0.3
info:
  title: MicroFire Atlas API
  version: 1.0.0
  description: Hand-derived from apps/web/app/api/ask/route.ts.
paths:
  /api/ask:
    post:
      summary: Answer a question from the atlas evidence only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  minLength: 3
                  maxLength: 400
                  example: What changed between B16 and B19?
      responses:
        "200": { description: Answer or evidence-only result }
        "400": { description: Invalid question }
        "429": { description: Rate limited }
