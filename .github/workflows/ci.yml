name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipelines/requirements.txt }
      - run: pip install -r pipelines/requirements.txt
      # test_build_dataset needs the NASA PDFs (run pipelines/fetch_sources.py locally); the rest run offline.
      - run: python -m unittest tests.test_model tests.test_flame_vision tests.test_insight_pipelines tests.test_next_experiments
